name: Claude Remote Control

on:
  # Trigger manually from the GitHub UI or via API
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to Claude"
        required: true
        type: string
      model:
        description: "Claude model ID"
        required: false
        default: "claude-sonnet-4-6"
        type: string

  # Trigger from repository_dispatch (external systems via GitHub API)
  repository_dispatch:
    types: [claude-trigger]

jobs:
  claude-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Resolve prompt
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "prompt=${{ github.event.client_payload.prompt }}" >> $GITHUB_OUTPUT
            echo "model=${{ github.event.client_payload.model || 'claude-sonnet-4-6' }}" >> $GITHUB_OUTPUT
          else
            echo "prompt=${{ github.event.inputs.prompt }}" >> $GITHUB_OUTPUT
            echo "model=${{ github.event.inputs.model }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python skills/remote-control/scripts/api_trigger.py \
            "${{ steps.resolve.outputs.prompt }}" \
            --model "${{ steps.resolve.outputs.model }}"

# --- How to trigger via GitHub API ---
#
# curl -X POST \
#   -H "Authorization: Bearer $GH_TOKEN" \
#   -H "Accept: application/vnd.github+json" \
#   https://api.github.com/repos/OWNER/REPO/dispatches \
#   -d '{"event_type":"claude-trigger","client_payload":{"prompt":"Review open PRs"}}'
